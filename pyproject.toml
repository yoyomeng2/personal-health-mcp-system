[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-health-mcp-system"
version = "0.1.0"
description = "A modular, local-first system to log, analyze, and predict personal health correlations using an MCP interface."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mike Menne", email = "mike.menne@gmail.com" },
    { name = "Mike Menne", email = "mmenne@phdata.io" },
]
keywords = ["health", "tracking", "mcp", "fastapi", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.95.0",
    "fastapi_mcp",
    "joblib>=1.5.2",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=1.10.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "scikit-learn>=1.2.2",
    "joblib>=1.2.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/yoyomeng2/personal-health-mcp-system"
Issues = "https://github.com/yoyomeng2/personal-health-mcp-system/issues"

[project.scripts]
generate-sample-data = "scripts.generate_sample_data:main"
init-db = "scripts.init_db:main"
export-sqlite-to-csv = "scripts.export_sqlite_to_csv:main"
import-csv-to-sqlite = "scripts.import_csv_to_sqlite:main"
train-model = "scripts.train_model:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.3.0",
    "mcp-server-sqlite",
    "openai==2.6.1",
    "ollama==0.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_health", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"src/personal_health/py.typed" = "personal_health/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/personal_health --cov-report=term-missing --strict-markers"
markers = ["unit: unit tests", "integration: integration tests"]

[tool.coverage.run]
source = ["src/personal_health"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["personal_health"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = [".venv", "venv"]

[[tool.mypy.overrides]]
module = "fastapi_mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
