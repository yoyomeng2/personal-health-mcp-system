services:
  personal-health-mcp:
    build: .
    container_name: personal-health-mcp
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./configs:/app/configs
    environment:
      - ENVIRONMENT=prod
    restart: unless-stopped
    command: "scripts/shell/run_http.sh"
    profiles:
      - http

  # Optional: HTTPS variant
  personal-health-mcp-https:
    build: .
    container_name: personal-health-mcp
    ports:
      - "8443:8443"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./configs:/app/configs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=prod
    restart: unless-stopped
    command: "scripts/shell/run_https.sh"
    profiles:
      - https
