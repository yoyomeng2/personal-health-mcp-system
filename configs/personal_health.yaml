# Default application configuration
# Override with environment-specific configs in configs/environments/

server:
  host: "0.0.0.0"
  port: 8080
  debug: false

database:
  path: "data/health.db"
  timeout: 30

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "data/logs/personal_health.log"

models:
  predictor_path: "data/model_v1.pkl"

llm:
  provider: "openai"  # Options: "openai", "ollama"
  model: "gpt-5o-mini"  # For OpenAI: gpt-4o-mini, gpt-4o, etc. For Ollama: llama3.2:latest, etc.
  api_key_env: "OPENAI_API_KEY"  # Environment variable name for API key
  base_url: null  # Optional: For Ollama use "http://localhost:11434/v1"
  temperature: 0.0  # 0.0 for deterministic extraction
  max_tokens: 1000  # Max tokens for response
